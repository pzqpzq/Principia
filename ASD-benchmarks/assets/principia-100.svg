<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Principia-100: From native data to testable relationships</title>
<desc id="desc">One hundred scientific scenarios, spanning many disciplines, with traceable sources and a source-aware evaluation protocol. Decorative curves illustrate data and quantitative relationships.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081524"/><stop offset="1" stop-color="#102b43"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#57e0cb"/><stop offset="1" stop-color="#72a7ff"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d1eaff" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1280" height="400" rx="18" fill="url(#bg)"/>
<rect width="1280" height="400" rx="18" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif">
 <text x="56" y="59" fill="#76d8cc" font-size="14" font-weight="700" letter-spacing="3">AUTONOMOUS SCIENTIFIC DISCOVERY</text>
 <text x="52" y="145" fill="#f1f7fd" font-size="68" font-weight="700" letter-spacing="-2">Principia-100</text>
 <text x="56" y="193" fill="#c1d2e3" font-size="24">100 scientific scenarios.</text>
 <text x="56" y="229" fill="#c1d2e3" font-size="24">Relationships you can put to the test.</text>
 <path d="M56 275H670" stroke="#adcde8" stroke-opacity=".2"/>
 <text x="56" y="314" fill="#ffffff" font-size="17" font-weight="700">NATIVE DATA</text>
 <text x="210" y="314" fill="#76d8cc" font-size="22">→</text>
 <text x="247" y="314" fill="#ffffff" font-size="17" font-weight="700">EQUATIONS</text>
 <text x="393" y="314" fill="#76d8cc" font-size="22">→</text>
 <text x="430" y="314" fill="#ffffff" font-size="17" font-weight="700">EVIDENCE</text>
 <text x="56" y="357" fill="#88a9c3" font-size="14">SOURCE-AWARE  /  VERSIONED  /  REPRODUCIBLE</text>
</g>
<g transform="translate(810 63)">
 <rect x="0" y="0" width="406" height="270" rx="16" fill="#0b1c2f" fill-opacity=".55" stroke="#8bb8df" stroke-opacity=".14"/>
