name: Submit reviewed Global Cloud branch

on:
  push:
    branches: ["principia-cloud/**"]
    paths: ["global-cloud/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reviewed-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-submit-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_global_cloud.py global-cloud
      - name: Reject forbidden files and secrets
        run: |
          test -z "$(find global-cloud -type f -size +50M -print -quit)"
          ! grep -RIE '(BEGIN (RSA |OPENSSH )?PRIVATE KEY|github_pat_|ghp_|/Users/|/home/)' global-cloud
      - name: Create checked PR and merge validated branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          pr="$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$HEAD_BRANCH" \
              --title "Global Cloud reviewed Admin publication" \
              --body "Submitted by Principia Admin after explicit item review. The branch passed canonical schema, ordering, forbidden-data, and secret checks."
            pr="$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          test -n "$pr"
          if ! gh pr merge "$pr" --auto --squash --delete-branch; then
            gh pr merge "$pr" --squash --delete-branch
          fi
