name: Submit reviewed Global Cloud branch

on:
  push:
    branches: ["principia-cloud/**"]
    paths: ["global-cloud/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reviewed-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-submit-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e Principia-v1.4.1/core
      - run: python Principia-v1.4.1/core/scripts/validate_global_cloud.py global-cloud
      - name: Reject forbidden files and secrets
        run: |
          test -z "$(find global-cloud -type f -size +50M -print -quit)"
          ! grep -RIE '(BEGIN (RSA |OPENSSH )?PRIVATE KEY|github_pat_|ghp_|/Users/|/home/)' global-cloud
      - name: Create checked PR and merge validated branch
        # A same-repository workflow cannot create or approve its own PR with
        # GITHUB_TOKEN on repositories that disable workflow-created PRs.
        # Principia Admin (SSH mode) or the connected GitHub app creates the
        # PR; this workflow is the required validation gate and merges it.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          pr="$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          test -n "$pr"
          if ! gh pr merge "$pr" --auto --squash --delete-branch; then
            gh pr merge "$pr" --squash --delete-branch
          fi
