name: Principia v1.4.2 CI

on:
  push:
    branches: [main]
    paths: ["Principia-v1.4.2/**", ".github/workflows/principia-v142-ci.yml"]
  pull_request:
    paths: ["Principia-v1.4.2/**", ".github/workflows/principia-v142-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: principia-v142-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Principia-v1.4.2/core-v1.4.2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Principia-v1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Principia-v1.4.2/core-v1.4.2/pyproject.toml
      - run: python -m pip install -e ".[dev,asd,local,notebook]"
      - run: python -m ruff check src tests scripts
      - run: python scripts/generate_openapi.py --check
      - run: python -m pytest -q
      - name: Verify five demos without original data or provider credentials
        run: python scripts/verify_bundled_demos.py

  frontend-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Principia-v1.4.2/core-v1.4.2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Principia-v1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Principia-v1.4.2/core-v1.4.2/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - run: python -m pip install build twine
      - run: pnpm install --frozen-lockfile
        working-directory: Principia-v1.4.2/core-v1.4.2/frontend
      - run: pnpm test
        working-directory: Principia-v1.4.2/core-v1.4.2/frontend
      - run: pnpm build
        working-directory: Principia-v1.4.2/core-v1.4.2/frontend
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_release_archive.py dist/*
      - name: Install the built wheel and verify its packaged demos
        run: |
          python -m pip install dist/*.whl
          python scripts/verify_bundled_demos.py
      - name: Enforce clean source size and exclusions
        run: python ../scripts/build_clean_release.py .. "$RUNNER_TEMP/principia-clean-v142" --public
